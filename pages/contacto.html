<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>Pet Shop - Contacto</title>

    <!--Tipografia-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

</head>
<body>
    <header>
        <a href="../index.html">
            <img src="../assets/logos/logo.png" alt="Logo Betchi" class="logo">
        </a>

        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../pages/productos.html">Productos</a></li>
                <li><a href="../pages/galeria.html">Galería</a></li>
                <li><a href="../pages/preguntasfrecuentes.html">Preguntas Frecuentes</a></li>
                <li><a href="../pages/contacto.html">Contacto</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <h1>Contacto</h1>
        <p>Estamos para ayudarte</p>

        <section class="form_contacto">
            <form action="" method="">
                <div class="resp_form">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="resp_form">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required>
                </div>
                <div class="resp_form">
                    <label for="telefono">Número de teléfono</label>
                    <input type="tel">
                </div>
                <div class="resp_form">
                    <label for="mensaje">Mensaje</label>
                    <textarea name="mensaje" id="mensaje"></textarea>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>

        <div>
            <div>
                <h2>Ubicación</h2>
                <p>CABA</p>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3282.845283177675!2d-58.
                5222264!3d-34.63334989999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcc839e5
                e2e8af%3A0x62093515f356beec!2sPet%20Shop%20-%20Natural%20Life%20-%20Liniers!5e0!3m2!1ses!2s
                ar!4v1790985455114!5m2!1ses!2sar" width="400" height="300" style="border:0;" 
                allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>

    </main>

    <footer>
        <p>&copy;<span id="year"></span> Todos los Derechos Reservados</p>
        <h3>Redes sociales</h3>
        <ul>
            <li>
                <a href="https://www.instagram.com/" target="_blank">
                    <img src="../assets/logos/instagram.png" alt="Logo de Instagram" class="logos">
                    <title>Instagram</title>
                </a>
            </li>
            <li>
                <a href="https://www.facebook.com/" target="_blank">
                    <img src="../assets/logos/facebook.png" alt="Logo de Facebook" class="logos">
                    <title>Facebook</title>
                </a>
            </li>
            <li>
                <a href="https://wa.me/" target="_blank">
                    <img src="../assets/logos/whatsapp.png" alt="Logo de Whatsapp" class="logos">
                    <title>Whatsapp</title>
                </a>
            </li>
        </ul>
    </footer> 
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    
    
</body>
</html>
